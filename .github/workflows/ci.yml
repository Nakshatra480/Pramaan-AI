# Continuous integration (audit M-14): lint, types, unit tests, production build and an
# end-to-end smoke run for the frontend; lint, types and the DB-backed suite for the backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Demo data source: the smoke suite needs no backend or secrets.
      NEXT_PUBLIC_DATA_SOURCE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the smoke suite
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end smoke
        run: |
          npx next start -p 3000 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
          BASE_URL=http://localhost:3000 npm run e2e

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pramaan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pramaan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      # Tests run against a migrated database (the fixtures truncate, they don't create tables).
      - run: alembic upgrade head
      - run: pytest -q
